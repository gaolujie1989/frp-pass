name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: frp-pass:ci
      - name: Validate Compose
        run: |
          cp .env.example .env
          cp config.example.toml config.toml
          cp deploy/frps.example.toml deploy/frps.toml
          docker compose -f compose.yaml -f compose.frps.yaml config --quiet
      - name: Validate Caddy
        run: docker run --rm -e AUTH_DOMAIN=access.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.7 caddy validate --config /etc/caddy/Caddyfile
      - name: Smoke test image
        run: python tests/smoke_container.py
