<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FRP 访问授权</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fa;color:#18253b;font:16px/1.6 system-ui,sans-serif;padding:24px}
    main{width:100%;max-width:420px;background:white;padding:32px;border:1px solid #e0e7ef;border-radius:16px;box-shadow:0 12px 32px #18253b0b}
    h1{font-size:24px;margin:0 0 8px}p{color:#56657b}code{overflow-wrap:anywhere}label{display:block;font-size:14px;margin:18px 0 6px}
    input{width:100%;padding:12px;border:1px solid #b7c3d3;border-radius:8px;font:inherit}input:focus{outline:2px solid #3075e0;outline-offset:2px}
    button{width:100%;margin-top:24px;padding:12px;background:#245edb;color:white;border:0;border-radius:8px;font:inherit;cursor:pointer}
    .notice:not(:empty),.success{padding:12px;border-radius:8px;background:#fff2df;color:#78470b}.success{background:#e8f6ed;color:#176438}small{display:block;color:#68768a;margin-top:20px}
  </style>
</head>
<body>
<main>
  <h1>FRP 访问授权</h1>
  <p>登录后，当前 IP 可在五分钟内建立获准通道的连接。</p>
  <p>当前 IP：<code>{{ip}}</code></p>
  <p class="{{state}}" role="status">{{message}}</p>
  <form method="post" action="/login">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" maxlength="128" required>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
    <button type="submit">授权当前 IP 五分钟</button>
  </form>
  <small>授权到期后，已有连接继续保持。共享同一公网 IP 的设备共享此次通道授权。</small>
</main>
</body>
</html>
