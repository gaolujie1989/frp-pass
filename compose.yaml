services:
  auth:
    build: .
    image: ghcr.io/gaolujie1989/frp-pass:0.1.0
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./config.toml
        target: /config/config.toml
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      authnet:
        ipv4_address: 172.30.55.3
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  authnet:
    ipam:
      config:
        - subnet: 172.30.55.0/24
